services:

  scheduler:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
      # Cap on concurrent tasks for the whole box. The host is 32 GB with no
      # swap, and every meter-read task (extract / transform / load) holds a
      # full batch of readings in memory; enough of them running together
      # exhausted the host on 8/17, 8/18, 8/24 and 8/26 (a restart re-adopting
      # orphaned tasks, an unpause burst, and the pre-stagger noon wave). With
      # staggered schedules the normal daily wave never has more than ~3-5
      # heavy tasks in flight and peaks around 60% of memory, so a 3-slot pool
      # leaves normal operations alone and only bites when something piles up.
      #
      # This value only seeds default_pool when the metastore has no row for
      # it (Airflow's add_default_pool_if_not_exists). The live value is in
      # the metastore and is changed in Admin -> Pools, effective on the next
      # scheduler loop, no deploy needed. Keep the two in agreement.
      AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 3
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

  webserver:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-webserver
    command: webserver
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
      # Cap on concurrent tasks for the whole box. The host is 32 GB with no
      # swap, and every meter-read task (extract / transform / load) holds a
      # full batch of readings in memory; enough of them running together
      # exhausted the host on 8/17, 8/18, 8/24 and 8/26 (a restart re-adopting
      # orphaned tasks, an unpause burst, and the pre-stagger noon wave). With
      # staggered schedules the normal daily wave never has more than ~3-5
      # heavy tasks in flight and peaks around 60% of memory, so a 3-slot pool
      # leaves normal operations alone and only bites when something piles up.
      #
      # This value only seeds default_pool when the metastore has no row for
      # it (Airflow's add_default_pool_if_not_exists). The live value is in
      # the metastore and is changed in Admin -> Pools, effective on the next
      # scheduler loop, no deploy needed. Keep the two in agreement.
      AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 3
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

networks:
  airflow:

volumes:
  logs:
