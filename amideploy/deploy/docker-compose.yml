services:

  scheduler:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Run one task at a time on this host. Meter-read tasks each hold a full
      # batch of readings in memory, the box is 32 GB with no swap, and Airflow's
      # default of 32 lets enough of them start together to exhaust it: every
      # freeze on record except the two single-oversized-task ones came from
      # several heavy tasks running at once, most often on scheduler start, when
      # orphan adoption re-executes every task that was running before.
      # The staggered schedules spread start times but cannot bound what is
      # already in flight, so they do not cover the restart case.
      # Cost is wall clock: a full day's tasks measured 8h56m end to end on
      # 2026-08-27, against a window that opens at 10:00 UTC.
      AIRFLOW__CORE__PARALLELISM: 1
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

  webserver:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-webserver
    command: webserver
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

networks:
  airflow:

volumes:
  logs:
