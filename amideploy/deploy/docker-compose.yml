services:

  scheduler:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
      # Caps how many tasks run at once. Too many concurrent meter-read
      # tasks can crash small servers (tens of GB of RAM, no swap): each
      # task holds a full batch of readings in memory, and without swap
      # the host livelocks rather than OOM-killing.
      #
      # Read only when Airflow creates default_pool in an empty metastore;
      # the live value is in Admin -> Pools.
      AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 3
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

  webserver:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-webserver
    command: webserver
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
      # See the scheduler service.
      AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 3
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

networks:
  airflow:

volumes:
  logs:
