services:

  scheduler:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
      # Caps how many tasks run at once. Meter-read tasks hold a full batch
      # of readings in memory, and a host with no swap livelocks instead of
      # OOM-killing when too many run together (a scheduler restart
      # re-adopting tasks, an unpause, a stacked backfill). Staggered
      # schedules keep the normal daily wave well below this number.
      #
      # Read only when Airflow creates default_pool in an empty metastore.
      # The live value is in Admin -> Pools (takes effect on the next
      # scheduler loop, no deploy); keep the two in agreement.
      AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 3
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

  webserver:
    image: airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-webserver
    command: webserver
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - airflow
    environment:
      AIRFLOW__WEBSERVER__AUTHENTICATE: True
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.security.auth_backend.password_auth
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: False
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/amicontrol/dags
      PYTHONPATH: /opt/airflow:/opt/airflow/amicontrol
      # See the scheduler service.
      AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 3
    volumes:
      - logs:/opt/airflow/logs
      - ./repo/amicontrol/dags:/opt/airflow/amicontrol/dags:ro
      - ./repo/amiadapters:/opt/airflow/amiadapters:ro
      - ./neptune:/opt/airflow/neptune:ro

networks:
  airflow:

volumes:
  logs:
